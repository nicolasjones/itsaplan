name: build-api-guard-estados

# Publica la API de It's a Plan CON el guard de estado por tipo (BUG-297, MSF-338).
# La imagen base es la versión que corre en producción (v1.6.0); el parche vive en la rama.
on:
  push:
    branches: [feature/guard-estado-por-tipo]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/itsaplan-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.6.0

      - uses: docker/setup-buildx-action@v3

      - name: Aplicar el parche del guard (BUG-297)
        run: |
          git apply --verbose ${{ github.workspace }}/patches/0001-guard-estado-por-tipo.patch

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=guard-1
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
